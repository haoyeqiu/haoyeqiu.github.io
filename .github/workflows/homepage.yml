name: Publish homepage and refresh Scholar metrics
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: homepage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public Scholar statistics
        run: python update-scholar.py
      - name: Render homepage
        run: node render.mjs
      - name: Save verified statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scholar-metrics.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Google Scholar metrics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css scholar-metrics.js scholar-metrics.json _site/
          cp -r images assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
